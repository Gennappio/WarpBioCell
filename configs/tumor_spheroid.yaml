# Baseline tumor spheroid experiment (AGENTS.md "Scientific objective").
#
# Units are in the key names. Every biological parameter carries a provenance label:
#   illustrative        chosen to make the model behave plausibly, no data behind it
#   estimated           derived from published numbers with stated assumptions
#   literature-derived  taken from a source, order of magnitude at least
#   fitted              calibrated against data (none yet)
# Details and sources: src/warpbiocell/fields/oxygen.py, src/warpbiocell/cells/lifecycle.py.

name: tumor_spheroid

simulation:
  duration_h: 168            # 7 days
  dt_cells_h: 0.25
  dt_mechanics_h: 0.025      # rate * dt_mechanics = 0.25 (limit 0.5)
  seed: 0
  device: auto               # cpu | cuda:0 | auto

cells:
  initial_count: 1000
  max_cells: 200000
  radius_um: 8.0             # illustrative (typical tumour cell radius 6-10 um)
  initial_spacing_factor: 1.0
  initial_jitter: 0.1

mechanics:
  stiffness: 10.0            # k [force/um], illustrative; only k/damping = 10 /h matters
  damping: 1.0               # gamma [force h/um], illustrative
  margin_um: 2.0             # neighbour query radius = 2 r + margin

lifecycle:
  division_rate_per_h: 0.0289      # ln(2)/24 h; illustrative (24 h doubling time)
  death_rate_per_h: 0.0            # baseline death; illustrative
  anoxic_death_rate_per_h: 0.5     # below death_threshold; illustrative
  inhibition_threshold: 8          # neighbours within 2r + margin; illustrative
  hypoxia_threshold_mmHg: 8.0      # ~1% O2, HIF activation range; estimated
  death_threshold_mmHg: 2.0        # illustrative
  placement_factor: 1.0

oxygen:
  enabled: true
  diffusion_um2_per_h: 7.2e+6          # 2000 um^2/s; literature-derived (order of magnitude)
  uptake_max_mmHg_um3_per_h: 1.4e+8    # 5e-17 mol/cell/s over alpha = 1.3 uM/mmHg; estimated
  michaelis_k_mmHg: 3.4                # 0.45% O2, MicroC half-saturation; estimated
  boundary_mmHg: 38.0                  # ~5% O2 at the box faces; illustrative (150 ~ air-saturated medium)
  grid:
    box_um: 800.0
    dx_um: 20.0
  solver:
    omega: 1.8
    tolerance: 1.0e-5
    max_sweeps: 2000
    check_every: 10

output:
  metrics_every_h: 1.0
  profile_every_h: 12.0
  checkpoint_every_h: 24.0
  shell_width_um: 20.0
  figures: true
